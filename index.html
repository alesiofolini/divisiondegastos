<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Expense Splitter</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#2ecc71" />
  <link rel="icon" href="icon-192.png" sizes="192x192">
  <link rel="apple-touch-icon" href="icon-512.png">
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js');
    }
  </script>
</head>
<body>
  <h1>Expense Splitter</h1>
  <input id="attendeeName" placeholder="Add attendee" />
  <button onclick="addAttendee()">Add</button>
  <ul id="attendeeList"></ul>

  <input id="payerSelect" placeholder="Who paid?" />
  <input id="amount" type="number" placeholder="Amount" />
  <input id="description" placeholder="Description" />
  <button onclick="addExpense()">Add Expense</button>
  <ul id="expenseList"></ul>

  <button onclick="calculate()">Calculate Split</button>
  <button onclick="shareResults()">Share via WhatsApp</button>
  <div id="results"></div>

  <script src="https://cdn.jsdelivr.net/npm/@tarekraafat/autocomplete.js@10.2.7/dist/autoComplete.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
